<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Lámpara de ejemplo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee7db"/><stop offset="1" stop-color="#ddd0bd"/>
    </linearGradient>
    <radialGradient id="shade" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f0b968" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#8c7b63" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4a3a2d" stop-opacity=".95"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0b968" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f0b968" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="590" r="330" fill="url(#halo)" filter="url(#soft)"/>
  <g filter="url(#grain)">
    <ellipse cx="600" cy="865" rx="210" ry="34" fill="#4a3a2d" opacity=".18"/>
       <rect x="586" y="700" width="28" height="150" rx="14" fill="#4a3a2d"/>
       <ellipse cx="600" cy="860" rx="150" ry="22" fill="#4a3a2d"/>
       <circle cx="600" cy="590" r="190" fill="url(#shade)"/>
       <circle cx="600" cy="590" r="190" fill="none" stroke="#4a3a2d" stroke-width="3" opacity=".55"/>
       <ellipse cx="600" cy="700" rx="62" ry="16" fill="#f0b968" opacity=".9"/>
  </g>
  <text x="72" y="1110" fill="#4a3a2d" opacity=".55" font-family="Georgia, serif" font-size="26" letter-spacing="8">LUMBRE · EJEMPLO</text>
</svg>