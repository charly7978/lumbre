<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Lámpara de ejemplo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe4d4"/><stop offset="1" stop-color="#e2cdb2"/>
    </linearGradient>
    <radialGradient id="shade" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e49a3f" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#b45b36" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2f2823" stop-opacity=".95"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e49a3f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e49a3f" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="720" cy="560" r="330" fill="url(#halo)" filter="url(#soft)"/>
  <g filter="url(#grain)">
    <line x1="600" y1="110" x2="600" y2="330" stroke="#2f2823" stroke-width="5"/>
         <path d="M600 300 L800 500 L600 760 L400 500 Z" fill="url(#shade)" stroke="#2f2823" stroke-width="3"/>
         <path d="M600 300 L600 760 M400 500 L800 500" stroke="#2f2823" stroke-width="2" opacity=".35"/>
         <ellipse cx="600" cy="770" rx="120" ry="26" fill="#e49a3f" opacity=".55"/>
  </g>
  <text x="72" y="1110" fill="#2f2823" opacity=".55" font-family="Georgia, serif" font-size="26" letter-spacing="8">LUMBRE · EJEMPLO</text>
</svg>