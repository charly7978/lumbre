name: Verificación de Lucian (opcional, manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar aplicación y pruebas
        working-directory: lumbre
        run: npm test
