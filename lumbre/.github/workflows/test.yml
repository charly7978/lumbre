name: Lumbre tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd lumbre && npm ci --ignore-scripts 2>/dev/null || true
      - name: Check & tests
        run: cd lumbre && npm run check && npm run test:search && npm run test:core && npm run test:guards && npm run test:flow
